<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Passport Photo Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 20px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 420px;
  margin: auto;
}

button {
  padding: 10px 15px;
  margin: 5px;
  cursor: pointer;
  background: #ddd;
  border: none;
  border-radius: 5px;
}

.bg-btn.active {
  background: #007bff;
  color: white;
}

.layout-btn.active {
  background: #28a745;
  color: white;
}

.hidden {
  display: none;
}

#status {
  margin-top: 10px;
  font-size: 14px;
  color: green;
}

img {
  margin-top: 20px;
  max-width: 100%;
}
</style>
</head>

<body>

<div class="container">
  <h2>Passport Photo Maker</h2>

  <input type="file" id="fileInput" onchange="showOptions()" />

  <div id="status"></div>

  <div id="options" class="hidden">

    <br>
    <b>Select Background:</b><br>
    <button class="bg-btn" onclick="selectBg(this, '#ffffff')">White</button>
    <button class="bg-btn" onclick="selectBg(this, '#2f5fa5')">Blue</button>
    <button class="bg-btn" onclick="selectBg(this, '#c0c0c0')">Grey</button>

    <br><br>
    <b>Select Layout:</b><br>
    <button class="layout-btn" onclick="selectLayout(this, 1)">Single</button>
    <button class="layout-btn" onclick="selectLayout(this, 8)">8 Photos</button>
    <button class="layout-btn" onclick="selectLayout(this, 16)">16 Photos</button>

    <br><br>
    <button style="background:#000;color:#fff;" onclick="processImage()">
      Generate Photo
    </button>

  </div>

  <img id="resultImage" />
  <br><br>
  <a id="downloadBtn" style="display:none;">Download</a>
</div>

<script>
let selectedBg = null;
let selectedLayout = null;
let modelLoaded = false;

// LOAD AI MODEL
async function loadModel() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(
    "https://justadudewhohacks.github.io/face-api.js/models"
  );
  modelLoaded = true;
  console.log("AI ready");
}
window.onload = loadModel;

// UI
function showOptions() {
  document.getElementById("options").classList.remove("hidden");
  document.getElementById("status").innerText = "Image selected. Choose options.";
}

function selectBg(btn, color) {
  selectedBg = color;
  document.querySelectorAll(".bg-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function selectLayout(btn, num) {
  selectedLayout = num;
  document.querySelectorAll(".layout-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

// PROCESS IMAGE
async function processImage() {
  const file = document.getElementById("fileInput").files[0];

  if (!file) return alert("Select image first");
  if (!selectedBg || !selectedLayout) return alert("Select options");

  document.getElementById("status").innerText = "Processing...";

  const reader = new FileReader();

  reader.onload = async function () {
    const base64 = reader.result.split(",")[1];

    const response = await fetch("/.netlify/functions/removebg", {
      method: "POST",
      body: JSON.stringify({ image: base64 })
    });

    if (!response.ok) {
      alert("API Error");
      return;
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    createPhoto(url);
  };

  reader.readAsDataURL(file);
}

// CREATE PHOTO WITH AI
async function createPhoto(imageUrl) {
  const img = new Image();
  img.src = imageUrl;

  img.onload = async function () {
    const canvas = document.createElement("canvas");
    canvas.width = 413;
    canvas.height = 531;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = selectedBg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let x, y, w, h;

    if (modelLoaded) {
      const detection = await faceapi.detectSingleFace(
        img,
        new faceapi.TinyFaceDetectorOptions()
      );

      if (detection) {
        const box = detection.box;

        const topPadding = 1.2;
        const bottomPadding = 1.5;
        const sidePadding = 1.0;

        const centerX = box.x + box.width / 2;
        const centerY = box.y + box.height / 2;

        w = box.width * (1 + sidePadding);
        h = box.height * (topPadding + bottomPadding);

        x = centerX - w / 2;
        y = centerY - (box.height * topPadding);

        x = Math.max(0, x);
        y = Math.max(0, y);
      }
    }

    // fallback
    if (!w) {
      const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
      w = img.width * scale;
      h = img.height * scale;
      x = (canvas.width - w) / 2;
      y = (canvas.height - h) / 2;
    }

    ctx.drawImage(img, x, y, w, h, 0, 0, canvas.width, canvas.height);

    // SINGLE
    if (selectedLayout === 1) {
      const finalImage = canvas.toDataURL("image/jpeg");
      showResult(finalImage, "passport.jpg");
      return;
    }

    // GRID
    let cols = 4;
    let rows = selectedLayout === 8 ? 2 : 4;
    const gap = 10;

    const sheet = document.createElement("canvas");
    sheet.width = cols * canvas.width + (cols - 1) * gap;
    sheet.height = rows * canvas.height + (rows - 1) * gap;

    const sctx = sheet.getContext("2d");

    sctx.fillStyle = "white";
    sctx.fillRect(0, 0, sheet.width, sheet.height);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        sctx.drawImage(canvas, c * (canvas.width + gap), r * (canvas.height + gap));
      }
    }

    const finalImage = sheet.toDataURL("image/jpeg");
    showResult(finalImage, "passport-grid.jpg");
  };
}

// SHOW RESULT
function showResult(imageData, fileName) {
  document.getElementById("status").innerText = "Done!";

  document.getElementById("resultImage").src = imageData;

  const btn = document.getElementById("downloadBtn");
  btn.href = imageData;
  btn.download = fileName;
  btn.style.display = "inline-block";
  btn.innerText = "Download";
}
</script>

</body>
</html>
